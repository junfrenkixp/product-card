<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Product Card</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="catalog">
    <div class="card">
      <img class="card-img"
          src="./img/card-1.png"
          height="170"
          width="268"
          alt="Avatar">
      <h2 class="card-title">Nova X</h2>
      <p class="card-descr">OLED-дисплей и двойная камера</p>
      <div class="card-footer">
        <div class="card-price">49 990 ₽</div>
        <button class="card-buy" type="button">Купить</button>
      </div>
    </div>
    <div class="card">
      <img class="card-img"
          src="./img/card-2.png"
          height="170"
          width="268"
          alt="Avatar">
      <h2 class="card-title">Sonic Pro</h2>
      <p class="card-descr">Полноразмерные беспроводные наушники с активным шумоподавлением, поддержкой быстрой зарядки и автономностью до 40 часов</p>
      <div class="card-footer">
        <div class="card-price">12 490 ₽</div>
        <button class="card-buy" type="button">Купить</button>
      </div>
    </div>
    <div class="card">
      <img class="card-img"
          src="./img/card-3.png"
          height="170"
          width="268"
          alt="Avatar">
      <h2 class="card-title">Pulse Watch</h2>
      <p class="card-descr">Умные часы для спорта и отслеживания активности</p>
      <div class="card-footer">
        <div class="card-price">18 990 ₽</div>
        <button class="card-buy" type="button">Купить</button>
      </div>
    </div>
  </div>
</body>
</html>
